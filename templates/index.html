<!DOCTYPE html>

<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Wordle Replica yye</title>
    <link rel="stylesheet" href="../static/styles.css">
</head>

<body style="text-align:center">
    
    <div class="w-timeselect">
        <div class="w-left-time">
            <button id="w-theme"> Light/Dark </button>
            <button id="w-pause"> PAUSE </button>
            <button id="restart"> RESTART </button>
        </div>

        <h1>Lexicon Leg</h1>
        <h2> Choose your time limit </h2>

        <button id="onemin"> 1 min </button>
        <button id="threemin"> 3 min </button>
    </div>

    <div class="w-game">    
        <div class="w-header">
            

            <div class="w-score"> SCORE: </div>
            <div class="w-title">LEXICON LEAGUE<h3>WORDLE</h3></div>
            <div class="w-timer">TIMER</div>

        </div>
        <div id="w-board"></div>
    </div>

    <div class="w-keyboard">
        <div class="w-keyboard-row">
            <button class="key" data-key="Q">Q</button>
            <button class="key" data-key="W">W</button>
            <button class="key" data-key="E">E</button>
            <button class="key" data-key="R">R</button>
            <button class="key" data-key="T">T</button>
            <button class="key" data-key="Y">Y</button>
            <button class="key" data-key="U">U</button>
            <button class="key" data-key="I">I</button>
            <button class="key" data-key="O">O</button>
            <button class="key" data-key="P">P</button>
        </div>

        <div class="w-keyboard-row">
            <button class="key" data-key="A">A</button>
            <button class="key" data-key="S">S</button>
            <button class="key" data-key="D">D</button>
            <button class="key" data-key="F">F</button>
            <button class="key" data-key="G">G</button>
            <button class="key" data-key="H">H</button>
            <button class="key" data-key="J">J</button>
            <button class="key" data-key="K">K</button>
            <button class="key" data-key="L">L</button>
        </div>

        <div class="w-keyboard-row">
            <button class="key" data-key="Z">Z</button>
            <button class="key" data-key="X">X</button>
            <button class="key" data-key="C">C</button>
            <button class="key" data-key="V">V</button>
            <button class="key" data-key="B">B</button>
            <button class="key" data-key="N">N</button>
            <button class="key" data-key="M">M</button>
        </div>
    </div>

    <div id="leaderboard">
        <h2>LEADERBOARD</h2>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../static/database.js"></script>
<script src="../static/words.js"></script>
<script src="../static/script.js"></script>
<script src="../static/timer.js"></script>
<script src="../static/leaderboard.js"></script>


</body>
</html>
