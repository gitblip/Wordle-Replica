<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Lexicon League — a timed Wordle game with leaderboard">
    <meta name="theme-color" content="#7ec8e3">
    <title>Lexicon League — Wordle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script>
        // Runs before first paint: picks the theme up front so a dark-mode user
        // never sees a flash of the light palette. timer.js re-applies it later
        // to sync the icon and theme-color.
        (function () {
            try {
                var saved = localStorage.getItem("lexicon-theme");
                var night = saved === "night" ||
                    (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches);
                if (night) {
                    document.documentElement.classList.add("night-mode");
                    document.querySelector('meta[name="theme-color"]')
                        .setAttribute("content", "#0b0e2a");
                }
            } catch (e) { /* storage blocked — fall back to the day palette */ }
        })();
    </script>
</head>

<body>

    <!-- Day/Night Toggle — always visible -->
    <button id="w-theme" class="theme-toggle" type="button" title="Toggle Day/Night" aria-label="Toggle day or night mode">
        <span class="theme-icon">☀️</span>
    </button>

    <!-- ==================== START SCREEN ==================== -->
    <div id="start-screen" class="screen active">
        <div class="start-card">
            <h1 class="start-title">LEXICON LEAGUE</h1>
            <p class="start-subtitle">WORDLE</p>
            <div class="horizon-line"></div>
            <h2 class="start-prompt">Choose your mode (you have no choice)</h2>
            <div class="time-buttons">
                <button id="onemin" class="time-btn" type="button">15 MIN</button>
                <!-- <button id="threemin" class="time-btn" type="button">3 MIN</button> -->
            </div>
            <!-- <button id="practice" class="practice-btn" type="button">PRACTICE &mdash; NO TIMER</button> -->
            <p class="start-hint">
                Solve as many words as you can within 15 mins.<br>
                Running out of guesses just moves you to a new word.<br>

                <strong>Built By Amith (@gitblip)</strong>
            </p>
        </div>
    </div>

    <!-- ==================== GAME SCREEN ==================== -->
    <div id="game-screen" class="screen">

        <div class="w-top">
            <div class="w-header">
                <div id="w-score" class="w-stat">
                    <span class="stat-label">SCORE</span>
                    <span class="stat-value" id="score-value">0</span>
                </div>
                <div class="w-title">
                    <span class="title-main">LEXICON LEAGUE</span>
                    <span class="title-sub">WORDLE</span>
                </div>
                <div id="w-timer" class="w-stat">
                    <span class="stat-label" id="timer-label">TIME</span>
                    <span class="stat-value" id="timer-value">0:00</span>
                </div>
            </div>

            <div class="game-controls">
                <button id="w-pause" class="ctrl-btn" type="button">⏸ PAUSE</button>
                <button id="w-restart" class="ctrl-btn" type="button">↻ RESTART</button>
                <!-- Practice mode has no clock, so it needs an explicit way out -->
                <button id="end-practice" class="ctrl-btn" type="button" hidden>✕ END</button>
                <button id="next-word" class="ctrl-btn" type="button" disabled>NEXT WORD ⏭</button>
            </div>

            <!-- Words already played this game -->
            <div id="w-history" class="w-history">
                <div id="history-track" class="history-track"></div>
            </div>
        </div>

        <div id="w-board"></div>

        <!-- On-screen Keyboard -->
        <div class="w-keyboard">
            <div class="w-keyboard-row">
                <button class="key" type="button" data-key="Q">Q</button>
                <button class="key" type="button" data-key="W">W</button>
                <button class="key" type="button" data-key="E">E</button>
                <button class="key" type="button" data-key="R">R</button>
                <button class="key" type="button" data-key="T">T</button>
                <button class="key" type="button" data-key="Y">Y</button>
                <button class="key" type="button" data-key="U">U</button>
                <button class="key" type="button" data-key="I">I</button>
                <button class="key" type="button" data-key="O">O</button>
                <button class="key" type="button" data-key="P">P</button>
            </div>

            <div class="w-keyboard-row w-keyboard-row-mid">
                <button class="key" type="button" data-key="A">A</button>
                <button class="key" type="button" data-key="S">S</button>
                <button class="key" type="button" data-key="D">D</button>
                <button class="key" type="button" data-key="F">F</button>
                <button class="key" type="button" data-key="G">G</button>
                <button class="key" type="button" data-key="H">H</button>
                <button class="key" type="button" data-key="J">J</button>
                <button class="key" type="button" data-key="K">K</button>
                <button class="key" type="button" data-key="L">L</button>
            </div>

            <div class="w-keyboard-row">
                <button class="key key-wide" type="button" data-key="ENTER">ENTER</button>
                <button class="key" type="button" data-key="Z">Z</button>
                <button class="key" type="button" data-key="X">X</button>
                <button class="key" type="button" data-key="C">C</button>
                <button class="key" type="button" data-key="V">V</button>
                <button class="key" type="button" data-key="B">B</button>
                <button class="key" type="button" data-key="N">N</button>
                <button class="key" type="button" data-key="M">M</button>
                <button class="key key-wide" type="button" data-key="BACKSPACE" aria-label="Backspace">⌫</button>
            </div>
        </div>

    </div>

    <!-- ==================== GAME OVER SCREEN ==================== -->
    <div id="gameover-screen" class="screen">
        <div class="gameover-card">
            <h2 id="gameover-title" class="gameover-title">TIME'S UP</h2>
            <p id="final-score" class="final-score"></p>

            <!-- Words played this game -->
            <div id="gameover-words" class="gameover-words"></div>

            <div id="submit-section" class="submit-section">
                <input id="player-name" class="name-input" placeholder="YOUR NAME" maxlength="20"
                       autocomplete="off" autocapitalize="characters" spellcheck="false"
                       aria-label="Your name">
                <button id="submit" class="submit-btn" type="button">SUBMIT SCORE</button>
            </div>

            <button id="w-retry" class="retry-btn" type="button">↻ PLAY AGAIN</button>

            <div class="horizon-line"></div>

            <div id="leaderboard">
                <h3 class="leaderboard-title">🏆 LEADERBOARD</h3>
                <div class="table-wrap">
                    <table id="leaderboard-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Player</th>
                                <th>Score</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Pause Overlay — outside the screens so it can cover the whole viewport -->
    <div id="pause-overlay">
        <div class="pause-card">
            <h2>PAUSED</h2>
            <p>Take a breath...</p>
            <button id="resume-btn" class="time-btn" type="button">▶ RESUME</button>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="database.js"></script>
<script src="words.js"></script>
<script src="acceptable_words.js"></script>
<script src="script.js"></script>
<script src="timer.js"></script>
<script src="leaderboard.js"></script>

</body>
</html>
